<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Videos — Nikato</title>
  <meta name="description" content="Learn how to use the Nikato app — step-by-step training videos for customers and store partners.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div id="site-nav"></div>

  <header class="page-header text-center">
    <div class="container">
      <h1 class="fw-bold mb-2">Training Videos</h1>
      <p class="text-white-50 col-lg-6 mx-auto">Short, simple guides to get the most out of Nikato — for customers and store partners.</p>
    </div>
  </header>

  <section class="py-5">
    <div class="container py-4">
      <div id="training-grid" class="row g-4">
        <div class="col-12">
          <div class="spinner-overlay text-brand">
            <div class="spinner-border" role="status"><span class="visually-hidden">Loading videos…</span></div>
          </div>
        </div>
      </div>
      <p class="text-center text-secondary small mt-4 mb-0">
        Can't find what you need? <a href="contact.html" class="brand-text fw-semibold text-decoration-none">Contact our support team</a>.
      </p>
    </div>
  </section>

  <!-- Video modal -->
  <div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="videoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-header">
          <h2 class="modal-title h5 fw-bold" id="videoModalLabel">Video</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="video-modal-body"></div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/training.js"></script>
</body>
</html>
